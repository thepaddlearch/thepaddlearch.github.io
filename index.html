<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Paddle Arch</title>
<meta name="description" content="Book Open Play or rent a court at The Paddle Arch.">
<meta name="theme-color" content="#176637">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* The Paddle Arch — single light theme, taken from the logo:
   court green #176637 / paddle green #2E733C on warm off-white. Committed single theme. */
:root{
  color-scheme: light;
  --bg:#F7F3EA; --paper:#FFFDF8; --deep:#EFE8DA; --line:#E3DAC8; --line-2:#D6CBB4;
  --ink:#18241C; --ink-2:#3B4A40; --muted:#6A766C; --faint:#9AA59C;
  --g9:#0B351D; --g8:#0F4A28; --g7:#176637; --g6:#2E733C; --g5:#3F8A4E; --g2:#C7DFCB; --g1:#E4F0E6; --g0:#F1F7F2;
  --clay:#A9793C; --clay-1:#F4E9D6;
  --warn:#9A5B00; --warn-bg:#FFF3DC; --warn-line:#F2D49A;
  --info:#1D5C86; --info-bg:#E6F1F8; --info-line:#BBD8EA;
  --bad:#A42A22; --bad-bg:#FCEBE8; --bad-line:#F1C3BD;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(24,36,28,.04),0 2px 8px -2px rgba(24,36,28,.08);
  --lift:0 18px 40px -16px rgba(11,53,29,.35);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--g7)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--g6)}
:focus-visible{outline:2px solid var(--g5);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px 16px}
.brand img{width:46px;height:auto}
.brand b{display:block;font-family:var(--display);font-size:17px;line-height:1.15}
.court-rule{height:7px;margin:0 20px 10px;background:linear-gradient(var(--g7),var(--g7)) top/100% 2px no-repeat,linear-gradient(var(--g2),var(--g2)) 0 5px/100% 1px no-repeat}
.nav{list-style:none;margin:0;padding:4px 12px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:0 12px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}
.nav button:hover{background:var(--g0);color:var(--g8)}
.nav button[aria-current="page"]{background:var(--g7);color:#fff}
.nav button:focus-visible{outline:2px solid var(--g5)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--warn-bg);color:var(--warn);border-radius:99px;font-size:11px;padding:1px 8px}
.nav button[aria-current="page"] .count{background:rgba(255,255,255,.2);color:#fff}
.nav .sec{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 12px 4px}
.who{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;font-size:13px}
.who img{width:34px;height:34px;border-radius:50%}
.main{min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;padding-inline:clamp(16px,3vw,40px)}
.topbar{display:none}
.banner{background:var(--clay-1);border-bottom:1px solid #E8D6B5;color:#6B4A1C;font-size:13px;padding:8px 16px;text-align:center}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:290px;max-width:86%;z-index:50;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--lift)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(24,36,28,.4);z-index:40}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:10px;padding:8px 12px;background:rgba(247,243,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .topbar img{width:34px}
  .topbar b{font-family:var(--display);font-size:16px}
}

/* ---------- building blocks ---------- */
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head p{margin-top:4px;color:var(--muted);max-width:640px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:980px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g5>:last-child:nth-child(odd),.g3>:last-child:nth-child(odd){grid-column:span 2}}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.pad-lg{padding:22px}
.card h2{margin-bottom:12px}
.sub{border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:12px}
.divider{height:1px;background:var(--line);margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;background:var(--g7);color:#fff;transition:background .12s,transform .06s;white-space:nowrap}
.btn:hover{background:var(--g8)} .btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--paper);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{background:var(--g0);border-color:var(--g5)}
.btn.ghost{background:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--g0);color:var(--g8)}
.btn.bad{background:var(--bad)} .btn.bad:hover{background:#861f18}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:17px;height:17px}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
label.f small,div.f small{font-weight:500;color:var(--muted)}
.in{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:11px;background:#fff;padding:9px 12px;outline:none;transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--g5);box-shadow:0 0 0 3px var(--g1)}
textarea.in{min-height:84px;resize:vertical}
.affix{position:relative;display:block}
.affix>span{position:absolute;top:0;bottom:0;display:flex;align-items:center;color:var(--muted);font-size:14px;pointer-events:none}
.affix>span.pre{left:12px} .affix>span.suf{right:12px}
.affix .in.pre{padding-left:28px} .affix .in.suf{padding-right:58px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--g7);margin-top:1px;flex:none}
.seg{display:inline-flex;background:var(--deep);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--g8);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;overflow-x:auto;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:4px;margin-bottom:18px;width:max-content;max-width:100%}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--g7);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.st-pending_payment{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.st-payment_submitted{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.st-confirmed{color:var(--g8);background:var(--g1);border-color:var(--g2)}
.st-checked_in{color:#fff;background:var(--g7);border-color:var(--g7)}
.st-completed{color:#57534e;background:#f0eeea;border-color:#e0dcd4}
.st-cancelled{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.st-no_show{color:#9a3d0b;background:#fdeee3;border-color:#f3cfb4}
.st-expired{color:#8b877f;background:#f0eeea;border-color:#e0dcd4}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--deep);color:var(--ink-2)}
.tag.demo{background:var(--clay-1);color:var(--clay)}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 14px;font-size:14px;border:1px solid var(--g2);background:var(--g0);color:var(--g9)}
.notice.warn{border-color:var(--warn-line);background:var(--warn-bg);color:#6b4000}
.notice.bad{border-color:var(--bad-line);background:var(--bad-bg);color:#6e1812}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--g0)}
.t td.r,.t th.r{text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700}
.stat{padding:16px}
.stat .l{font-size:12.5px;font-weight:700;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:30px;font-weight:600;margin-top:4px;line-height:1.1}
.stat .v small{font-family:var(--sans);font-size:14px;color:var(--faint);font-weight:600;margin-left:4px}
.stat .d{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.warn .v{color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--deep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g6);border-radius:99px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- schedule grid ---------- */
.sched{display:grid;gap:0;min-width:560px;font-size:12.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sched .h{position:sticky;top:0;background:var(--deep);font-weight:800;padding:8px;border-bottom:1px solid var(--line);text-align:center;font-size:12px}
.sched .tm{padding:0 8px;color:var(--muted);border-right:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:11.5px;display:flex;align-items:flex-start;padding-top:3px}
.sched .col{position:relative;border-right:1px solid var(--line)}
.sched .col:last-child{border-right:0}
.sched .slot{border-bottom:1px dashed #EEE7D9}
.sched .slot.hour{border-bottom:1px solid var(--line)}
.blk{position:absolute;left:4px;right:4px;border-radius:9px;padding:5px 8px;overflow:hidden;cursor:pointer;border:1px solid;font-weight:700;line-height:1.25;text-align:left}
.blk small{display:block;font-weight:600;opacity:.85}
.blk.op{background:repeating-linear-gradient(135deg,var(--g1) 0 8px,#EAF3EC 8px 16px);border-color:var(--g2);color:var(--g8)}
.blk.pending_payment{background:var(--warn-bg);border-color:var(--warn-line);color:#6b4000}
.blk.payment_submitted{background:var(--info-bg);border-color:var(--info-line);color:#123f5c}
.blk.confirmed{background:var(--g1);border-color:var(--g5);color:var(--g9)}
.blk.checked_in{background:var(--g7);border-color:var(--g8);color:#fff}
.blk.completed,.blk.no_show{background:#F0EEEA;border-color:#DDD8CE;color:#57534e}
.nowline{position:absolute;left:0;right:0;height:2px;background:#C8402F;z-index:3;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid;vertical-align:-2px;margin-right:5px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media (max-width:980px){.pos{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:border-color .1s,transform .06s}
.tile:hover{border-color:var(--g5)} .tile:active{transform:scale(.98)}
.tile b{font-size:14.5px;line-height:1.25}
.tile .p{font-family:var(--display);font-size:19px;font-weight:600;color:var(--g8)}
.tile .s{font-size:12px;color:var(--muted)}
.tile.out{opacity:.5}
.tile.eq{background:var(--g0);border-color:var(--g2)}
.cart{position:sticky;top:16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:17px}
.qty button:hover{background:var(--g0)}
.qty span{min-width:30px;text-align:center;font-weight:800}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(24,36,28,.45);z-index:60;display:flex;justify-content:flex-end}
.modal{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;box-shadow:var(--lift);padding-block:20px 40px;padding-inline:clamp(16px,3vw,26px);animation:slide .18s ease-out}
.modal.center{margin:auto;height:auto;max-height:92%;border-radius:18px}
.modal-bg.c{justify-content:center;align-items:center;padding:16px}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:var(--lift);animation:up .2s ease-out}
.toast.bad{background:var(--bad)}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.ref{font-family:var(--mono);font-weight:700;letter-spacing:.02em}
.bigref{font-family:var(--mono);font-size:clamp(22px,6vw,32px);font-weight:700;color:var(--g8);letter-spacing:.02em}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--g6)}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px}
.choice:hover{border-color:var(--g5)}
.choice[aria-pressed="true"]{border-color:var(--g7);background:var(--g0);box-shadow:0 0 0 3px var(--g1)}
.choice.dis{opacity:.5;cursor:not-allowed}
.hero-empty{display:grid;place-items:center;text-align:center;padding:40px 16px;gap:10px}
.setup{max-width:780px;margin:0 auto;padding-block:30px 60px;padding-inline:16px}
.pay-acct{border:1px dashed var(--line-2);border-radius:12px;padding:12px;background:#fff}

/* ---------- public site ---------- */
.pub{min-height:100%;display:flex;flex-direction:column}
.pub-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1080px;width:100%;margin:0 auto;padding-block:14px;padding-inline:clamp(16px,3vw,32px)}
.pub-top a.brand-mini{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.pub-top a.brand-mini img{width:40px}
.pub-top a.brand-mini b{font-family:var(--display);font-size:18px}
.pub-main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding-block:8px 48px;padding-inline:clamp(16px,3vw,32px)}
.pub-narrow{max-width:640px;margin:0 auto}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;padding-block:18px 26px}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.02;letter-spacing:-.02em}
.hero p.lead{font-size:17px;color:var(--ink-2);margin-top:12px;max-width:470px}
.hero .logo-wrap{justify-self:center}
.hero .logo-wrap img{width:min(300px,70vw)}
@media (max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero p.lead{margin-inline:auto}.hero .logo-wrap{order:-1}.hero .logo-wrap img{width:200px}}
.kind{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:border-color .12s,transform .08s}
.kind:hover{border-color:var(--g5);transform:translateY(-1px)}
.kind .court-rule{margin:0 0 10px;width:64px}
.kind h2{font-size:26px}
.kind .price{font-family:var(--display);font-size:20px;color:var(--g7);font-weight:600}
.kind .go{margin-top:8px;font-weight:800;color:var(--g7);display:inline-flex;align-items:center;gap:6px}
.kind .go svg{width:18px;height:18px}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px 16px;text-align:center}
.foot a{color:var(--muted)}
.datestrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.datestrip button{all:unset;box-sizing:border-box;cursor:pointer;scroll-snap-align:start;flex:none;width:74px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 6px;text-align:center}
.datestrip button b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.datestrip button small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.datestrip button[aria-pressed="true"]{border-color:var(--g7);background:var(--g7);color:#fff}
.datestrip button[aria-pressed="true"] small{color:var(--g1)}
.upload{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;background:#fff;cursor:pointer}
.upload:hover{border-color:var(--g5)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.upload img{max-height:180px;border-radius:10px}
.upload.upload-sm{padding:12px;border-width:1.5px;gap:4px;position:relative}
.upload.upload-sm svg{width:18px;height:18px}
.total-box{background:var(--g9);color:#fff;border-radius:16px;padding:18px}
.total-box .kv dt{color:var(--g2)} .total-box .kv dd{color:#fff}
.total-box .big{font-family:var(--display);font-size:30px}
.login{max-width:420px;margin:0 auto;padding-block:30px 60px;padding-inline:16px}

/* links styled like the app's buttons */
.nav a{box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:0 12px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink-2);text-decoration:none}

.nav a svg{width:18px;height:18px;flex:none}
.seg a{padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.seg a[aria-pressed="true"]{background:var(--paper);color:var(--g8);box-shadow:var(--shadow)}

.tabs a[aria-pressed="true"]{background:var(--g7);color:#fff}
a.btn{text-decoration:none}
a.blk{display:block}
button.blk{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.pub-top nav{flex-wrap:nowrap}
@media (max-width:420px){.pub-top a.brand-mini b{font-size:16px}.pub-top .btn.sm{padding:0 8px}}
.brand b{font-size:18px}

const TZ = "Asia/Manila", TZ_OFFSET = "+08:00";
const toMin = (t) => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const toHHMM = (m) => { m = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const clockOf = (m) => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60, suf = h >= 12 ? "PM" : "AM", h12 = h % 12 || 12; return mm ? `${h12}:${String(mm).padStart(2, "0")} ${suf}` : `${h12} ${suf}`; };

const fmtRange = (a, b) => `${fmtT(a)} – ${fmtT(b)}`;

class UserError extends Error {}

function friendly(err) {
  if (!err) return "Something went wrong. Please try again.";
  if (err instanceof UserError) return err.message;
  const m = String(err.message || err.error_description || err);
  if (/row-level security|permission denied|42501/.test(m) || err.code === "42501") return /You do not have|You don't|Only /.test(m) ? m : "You don't have permission to do that.";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Can't reach the server. Check your internet connection and try again.";

  if (/duplicate key/.test(m)) return "That name or code is already in use.";

}

function toast(msg, bad = false) { const el = document.createElement("div"); el.className = "toast" + (bad ? " bad" : ""); el.textContent = msg; $("#toast").appendChild(el); setTimeout(() => el.remove(), bad ? 5500 : 2800); }
async function run(fn, ok) {
  try { const r = await fn(); if (ok) toast(typeof ok === "function" ? ok(r) : ok); return r === undefined ? true : r; }
  catch (e) { console.error(e); toast(friendly(e), true); return undefined; }
}
function downloadCSV(filename, rows) {
  const csv = "﻿" + rows.map((r) => r.map((v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s; }).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// ---------------------------------------------------------------- receipts (optional attachments, private "receipts" bucket)
const RECEIPT_FOLDER = { purchase: "purchases", expense: "expenses", refund: "refunds", payout: "payouts" };
const receiptField = (label = "Receipt (optional)") => (`<div class="f">${label}<label class="upload upload-sm" data-receipt-pick><span class="row" style="gap:8px;justify-content:center">${ic("upload")}<b data-rl>Attach photo or PDF</b></span><small class="muted">JPG, PNG or PDF · up to 10 MB</small><input type="file" name="receipt" accept="image/*,application/pdf"></label></div>`);
async function uploadReceipt(kind, file) {
  if (!file || !file.size) return null;
  if (file.size > 10 * 1024 * 1024) fail("That receipt is over 10 MB. Please attach a smaller photo or PDF.");
  if (!/^image\/|application\/pdf/.test(file.type || "") && !/\.(jpe?g|png|webp|heic|pdf)$/i.test(file.name)) fail("Receipts must be a photo (JPG, PNG) or a PDF.");
  const ext = ((file.name.match(/\.([A-Za-z0-9]{2,5})$/) || [])[1] || (file.type === "application/pdf" ? "pdf" : "jpg")).toLowerCase();
  const path = `${RECEIPT_FOLDER[kind]}/${PUB.today.slice(0, 7)}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from("receipts").upload(path, file, { contentType: file.type || "application/octet-stream", upsert: false });
  if (error) throw error;
  return path;
}
const receiptBtn = (path) => path ? `<button type="button" class="btn ghost sm" data-receipt="${esc(path)}">${ic("receipt")} Receipt</button>` : "";
const attachBtn = (kind, id) => `<button type="button" class="btn ghost sm" data-attach="${kind}" data-id="${esc(id)}">${ic("upload")} Add receipt</button>`;
const receiptCell = (kind, id, path, canAttach) => path ? receiptBtn(path) : canAttach ? attachBtn(kind, id) : "";
async function showReceipt(el) {
  const path = el.dataset.receipt;
  const url = await run(async () => { const { data, error } = await sb.storage.from("receipts").createSignedUrl(path, 600); if (error) throw error; return data.signedUrl; });
  if (!url) return;
  const view = /\.pdf$/i.test(path)
    ? `<iframe src="${esc(url)}" title="Receipt" style="width:100%;height:480px;border:1px solid var(--line);border-radius:12px"></iframe>`
    : `<img src="${esc(url)}" alt="Receipt" style="width:100%;border:1px solid var(--line);border-radius:12px;display:block">`;
  const link = `<a href="${esc(url)}" target="_blank" rel="noopener" class="muted" style="font-size:13px">Open full size</a>`;
  if (MODAL) { // inside an open window (e.g. a booking): show it right under the button
    const box = el.nextElementSibling?.classList.contains("proof-view") ? el.nextElementSibling : null;
    if (box) return box.remove();
    el.insertAdjacentHTML("afterend", `<div class="proof-view">${view}${link}</div>`);
  } else openModal({ render: () => `${mhead("Receipt")}<div class="stack">${view}${link}</div>` });
}
function attachLater(el) {
  const input = document.createElement("input"); input.type = "file"; input.accept = "image/*,application/pdf";
  input.addEventListener("change", async () => {
    const file = input.files[0]; if (!file) return;
    el.disabled = true;
    const ok = await run(async () => { const path = await uploadReceipt(el.dataset.attach, file); await rpc("attach_receipt", { p_kind: el.dataset.attach, p_id: el.dataset.id, p_path: path }); }, "Receipt attached.");
    el.disabled = false;
    if (ok) { if (MODAL && typeof Staff !== "undefined" && Staff.drawer?.b) await Staff.reloadBooking(); else render(); }
  });
  input.click();
}
document.addEventListener("click", (e) => {
  const r = e.target.closest("[data-receipt]"); if (r) { e.preventDefault(); showReceipt(r); return; }
  const a = e.target.closest("[data-attach]"); if (a) { e.preventDefault(); attachLater(a); }
});
document.addEventListener("change", (e) => {

  const lab = t.closest("[data-receipt-pick]")?.querySelector("[data-rl]"); if (lab) lab.textContent = t.files[0] ? t.files[0].name : "Attach photo or PDF";

function copyText(t) { navigator.clipboard?.writeText(t).then(() => toast("Copied."), () => toast("Couldn't copy — select the text instead.", true)); }

// ---------------------------------------------------------------- modal
let MODAL = null;
function openModal(m) { MODAL = m; renderModal(); }
function closeModal() { MODAL = null; renderModal(); }
function renderModal() {
  const root = $("#modal-root");
  if (!MODAL) { root.innerHTML = ""; document.body.style.overflow = ""; return; }
  const sc = root.querySelector(".modal")?.scrollTop || 0;
  root.innerHTML = `<div class="modal-bg ${MODAL.center ? "c" : ""}" data-bg><div class="modal ${MODAL.center ? "center" : ""}" role="dialog" aria-modal="true">${MODAL.render()}</div></div>`;
  document.body.style.overflow = "hidden";
  root.querySelector(".modal").scrollTop = sc;
  root.querySelector("[data-bg]").addEventListener("click", (e) => { if (e.target.hasAttribute("data-bg")) closeModal(); });
  root.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  MODAL.bind?.(root.querySelector(".modal"));
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && MODAL) closeModal(); });
const mhead = (title, eyebrow = "") => `<div class="mhead"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ""}<h2>${title}</h2></div><button class="btn ghost sm" data-close aria-label="Close">${ic("close")}</button></div>`;
// bind helper: delegate [data-a] clicks inside a root to a handler map
function wire(root, handlers) {
  root.querySelectorAll("[data-a]").forEach((el) => {
    const evt = el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type !== "button" && el.type !== "submit") ? "change" : "click";
    el.addEventListener(evt, (e) => { const h = handlers[el.dataset.a]; if (h) { if (evt === "click") e.preventDefault(); h(el, e); } });
  });
  root.querySelectorAll("form[data-f]").forEach((f) => f.addEventListener("submit", async (e) => {
    e.preventDefault(); const h = handlers[f.dataset.f]; if (!h) return;
    const btn = f.querySelector("button:not([type=button])"); if (btn) btn.disabled = true;
    try { await h(f, formData(f)); } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
  }));
}

      : `<h2>Staff sign-in</h2><form class="stack" data-f="signin">${field("Email", inp("email", "", 'type="email" required autocomplete="email"'))}${field("Password", inp("password", "", 'type="password" required autocomplete="current-password"'))}<button class="btn block">Sign in</button></form>
        <button type="button" class="btn ghost sm" data-a="forgot" style="align-self:flex-start">Forgot password?</button>`}
      </div><p class="muted" style="text-align:center;margin-top:16px"><a href="#/">← Back to the booking site</a></p></div>`;
    wire(APP, {
      m: (el) => nav(el.dataset.m ? "#/staff?mode=signup" : "#/staff"),
      signin: async (f, d) => { const ok = await run(async () => { const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.password }); if (error) throw error; }); if (ok) render(); },
      signup: async (f, d) => {
        const ok = await run(async () => {
          const { data, error } = await sb.auth.signUp({ email: d.email.trim(), password: d.password, options: { data: { full_name: d.name.trim() }, emailRedirectTo: location.origin + location.pathname + "#/staff" } });
          if (error) throw error;
          if (!data.session) fail("Account created. Check your email to confirm it, then sign in.");
        });
        if (ok) render();
      },
      forgot: async () => {
        const email = APP.querySelector("#f-email")?.value.trim();
        if (!email) return toast("Type your email above first.", true);
        await run(async () => { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + "#/staff/reset" }); if (error) throw error; }, "Check your email for a link to reset your password.");
      },
    });
  },

  // ------------------------------------------------------------ booking drawer
  async openBooking(id) {
    Staff.drawer = { id, mode: null, b: null };
    openModal({ render: () => `<p class="muted">Loading…</p>` });
    await Staff.reloadBooking();
  },
  async reloadBooking() {
    try { Staff.drawer.b = await rpc("staff_booking", { p_id: Staff.drawer.id }); } catch (e) { toast(friendly(e), true); }
    openModal({ render: Staff.drawerHTML, bind: Staff.drawerBind });
  },
  drawerHTML() {
    const b = Staff.drawer.b, m = Staff.drawer.mode;
    if (!b) return mhead("Booking not found");
    const st = b.status, pend = sum(b.payments.filter((p) => p.status === "submitted"), (p) => p.amount), bal = Number(b.balance_due);
    const methods = Staff.methods || [];
    const counterOnly = !Staff.can("bookings.verify_payment");
    const what = b.booking_type === "open_play" ? `Open Play · ${b.player_count} player${b.player_count > 1 ? "s" : ""}` : b.lines.map((l) => `${esc(l.court)} · ${fmtRange(l.starts_at, l.ends_at)}`).join("<br>");
    let action = "";
    if (m === "pay") {
      const opts = methods.filter((x) => x.is_active && (!counterOnly || x.kind === "cash"));
      const needFee = Math.max(b.reservation_fee_amount - b.amount_paid - pend, 0);
      action = `<form class="card stack" data-f="pay"><h3>Record a payment</h3>${counterOnly ? `<p class="muted" style="font-size:13px">You can record cash received at the counter. GCash and bank transfers are confirmed by a manager.</p>` : ""}
        <div class="grid g2">${field("Amount", money("amount", round2(needFee > 0 ? needFee : bal - pend), `required max="${bal - pend}"`), `Balance ${peso(bal - pend)}`)}${field("Paid via", sel("method", opts.map((x) => [x.id, x.name]), opts[0]?.id))}</div>
        <div class="grid g2">${field("For", sel("kind", [["reservation", "Reservation fee"], ["balance", "Remaining balance"], ["full", "Full payment"]], needFee > 0 ? "reservation" : "balance"))}${field("Reference no.", inp("refno", "", 'placeholder="optional"'))}</div>
        <div class="row"><button class="btn">Save payment</button><button type="button" class="btn ghost" data-a="mode">Back</button></div></form>`;
    }
    if (m === "reject") action = `<form class="card stack" data-f="reject"><h3>Reject payment</h3>${field("Reason (the customer sees this)", inp("reason", "", 'required placeholder="e.g. Screenshot unreadable, amount doesn\'t match"'))}<div class="row"><button class="btn bad">Reject</button><button type="button" class="btn ghost" data-a="mode">Back</button></div></form>`;
    if (m === "checkin") action = `<form class="card stack" data-f="checkin"><h3>Check in</h3>${b.booking_type === "open_play" ? field(`Players who arrived (of ${b.player_count})`, `<input class="in num" type="number" name="players" min="0" max="${b.player_count}" value="${b.players_checked_in ?? b.player_count}">`) : ""}${bal > 0 ? notice(`Balance of <b>${peso(bal)}</b> still to collect.`, "warn") : ""}<div class="row"><button class="btn">${ic("check")} Check in</button><button type="button" class="btn ghost" data-a="mode">Back</button></div></form>`;
    if (m === "cancel" && b.quote) {
      const q = b.quote;
      const txt = { refundable: `Cancelled ${Math.floor(q.hours_before / 24)} days ahead — refundable (${q.refund_pct}% of what was paid).`, forfeit: `Less than the no-refund window — the reservation fee is kept.`, admin_decides: `In the in-between window — you decide the refund.` }[q.tier];
      action = `<form class="card stack" data-f="cancel"><h3>Cancel booking</h3>${notice(`${txt} Paid so far: <b>${peso(q.amount_paid)}</b>. Starts ${relTime(b.starts_at)}.`, q.tier === "forfeit" ? "warn" : "")}
        ${field("Refund amount", money("refund", q.suggested_refund ?? "", `max="${q.amount_paid}"`), q.suggested_refund != null ? `Suggested ${peso(q.suggested_refund)}${q.allow_override ? " — change it to override" : ""}` : "Enter ₱0 to keep everything paid.")}
        ${field("Reason", `<textarea class="in" name="reason" required placeholder="e.g. Customer called — rain"></textarea>`)}
        <div class="row"><button class="btn bad">Cancel & release the court</button><button type="button" class="btn ghost" data-a="mode">Back</button></div></form>`;
    }
    if (m === "refund") action = `<form class="card stack" data-f="refund"><h3>Record refund paid out</h3>${field("Amount", money("amount", b.refund_due || "", `max="${b.amount_paid}"`))}${field("Paid via", sel("method", methods.filter((x) => x.is_active).map((x) => [x.id, x.name])))}${field("Reference no.", inp("refno", ""))}${receiptField("Transfer receipt (optional)")}<div class="row"><button class="btn">Record refund</button><button type="button" class="btn ghost" data-a="mode">Back</button></div></form>`;
    if (m === "extend") action = `<form class="card stack" data-f="extend"><h3>Give more time to pay</h3>${field("Add", suffix("hours", 4, "hours", 'min="1" max="168"'))}<div class="row"><button class="btn">Extend</button><button type="button" class="btn ghost" data-a="mode">Back</button></div></form>`;
    const btns = [];
    if (!m) {
      if (["pending_payment", "payment_submitted", "confirmed", "checked_in", "no_show"].includes(st) && bal - pend > 0 && (Staff.can("payments.collect") || Staff.can("bookings.verify_payment"))) btns.push(`<button class="btn" data-a="mode" data-m="pay">Record payment</button>`);
      if (Staff.can("bookings.checkin") && (["confirmed", "no_show"].includes(st) || (st === "checked_in" && b.booking_type === "open_play"))) btns.push(`<button class="btn ${bal > 0 ? "sec" : ""}" data-a="mode" data-m="checkin">${st === "checked_in" ? "Update check-in" : "Check in"}</button>`);
      if (Staff.can("bookings.checkin") && st === "checked_in") btns.push(`<button class="btn sec" data-a="outcome" data-to="completed">Mark completed</button>`);
      if (Staff.can("bookings.checkin") && st === "confirmed" && new Date(b.starts_at) < Date.now()) btns.push(`<button class="btn sec" data-a="outcome" data-to="no_show">No show</button>`);
      if (Staff.can("bookings.verify_payment") && st === "pending_payment") btns.push(`<button class="btn sec" data-a="mode" data-m="extend">Give more time</button>`);
      if (Staff.can("bookings.cancel") && b.quote) btns.push(`<button class="btn ghost" data-a="mode" data-m="cancel">Cancel booking</button>`);
      if (Staff.can("bookings.cancel") && st === "cancelled" && Number(b.refund_due) > 0) btns.push(`<button class="btn" data-a="mode" data-m="refund">Record refund (${peso(b.refund_due)} due)</button>`);
    }
    const pays = b.payments.map((p) => `<div class="sub stack" style="gap:6px">
      <div class="row" style="justify-content:space-between"><b class="num">${p.kind === "refund" ? "−" : ""}${peso(p.amount)}</b><span class="pill ${p.status === "verified" ? "st-confirmed" : p.status === "submitted" ? "st-payment_submitted" : "st-cancelled"}">${p.kind === "refund" ? "Refund" : { verified: "Confirmed", submitted: "Waiting for review", rejected: "Rejected" }[p.status]}</span></div>
      <div class="muted" style="font-size:13px">${esc({ reservation: "Reservation fee", balance: "Balance", full: "Full payment", refund: "Refund", other: "Payment" }[p.kind])} · ${esc(p.method || "")}${p.reference_no ? ` · Ref <span class="mono">${esc(p.reference_no)}</span>` : ""} · ${fmtDT(p.submitted_at)}${p.recorded_by ? ` · by ${esc(p.recorded_by)}` : " · by customer"}</div>
      ${p.status !== "submitted" && p.verified_by && p.kind !== "refund" ? `<div class="muted" style="font-size:12.5px">${p.status === "verified" ? "Confirmed" : "Rejected"} by ${esc(p.verified_by)}, ${fmtDT(p.verified_at)}${p.rejection_reason ? ` — “${esc(p.rejection_reason)}”` : ""}</div>` : ""}
      ${p.proofs.map((path) => `<button type="button" class="btn sec sm" data-a="proof" data-p="${esc(path)}" style="align-self:flex-start">View payment screenshot</button>`).join("")}
      ${p.kind === "refund" && (p.receipt || Staff.can("bookings.cancel")) ? `<div>${receiptCell("refund", p.id, p.receipt, Staff.can("bookings.cancel"))}</div>` : ""}
      ${p.status === "submitted" && Staff.can("bookings.verify_payment") ? `<div class="row"><button class="btn sm" data-a="approve" data-id="${p.id}">${ic("check")} Confirm payment</button><button class="btn sec sm" data-a="rejectm" data-id="${p.id}">Reject</button></div>` : ""}
    </div>`).join("") || `<p class="muted">No payments yet.</p>`;
    return `${mhead(`<span class="bigref">${esc(b.reference)}</span>`, b.booking_type === "open_play" ? "Open Play" : "Court Rental")}
    <div class="stack">
      <div class="row">${statusPill(st)}${st === "pending_payment" && b.expires_at ? `<span class="muted" style="font-size:13px">Pay by ${fmtDT(b.expires_at)} (${relTime(b.expires_at)})</span>` : ""}</div>
      <div class="card"><dl class="kv"><dt>Customer</dt><dd>${esc(b.customer_name)}${b.customer_phone ? `<br><span class="mono" style="font-weight:500">${esc(b.customer_phone)}</span>` : ""}</dd>
        <dt>Date</dt><dd>${fmtDate(b.business_date, { weekday: "long", month: "long", day: "numeric" })}</dd><dt>Time</dt><dd>${fmtRange(b.starts_at, b.ends_at)}</dd>
        <dt>${b.booking_type === "open_play" ? "Session" : "Courts"}</dt><dd>${what}</dd>
        ${b.booking_type === "open_play" && b.players_checked_in != null ? `<dt>Checked in</dt><dd>${b.players_checked_in} of ${b.player_count}</dd>` : ""}
        <dt>Booked</dt><dd style="font-weight:500">${fmtDT(b.created_at)} · ${esc({ online: "online by customer", walk_in: "walk-in", phone: "phone / Messenger", admin: "admin" }[b.source] || b.source)}${b.created_by_name ? ` (${esc(b.created_by_name)})` : ""}</dd>
        ${b.notes ? `<dt>Notes</dt><dd style="font-weight:500">${esc(b.notes)}</dd>` : ""}</dl></div>
      <div class="card"><dl class="kv num"><dt>Total</dt><dd>${peso(b.total_amount)}</dd><dt>Reservation fee (${Number(b.reservation_fee_pct)}%)</dt><dd>${peso(b.reservation_fee_amount)}</dd><dt>Paid (confirmed)</dt><dd>${peso(b.amount_paid)}</dd>
        ${pend ? `<dt>Waiting for review</dt><dd style="color:var(--info)">${peso(pend)}</dd>` : ""}${Number(b.amount_refunded) ? `<dt>Refunded</dt><dd>${peso(b.amount_refunded)}</dd>` : ""}
        <dt>Outstanding</dt><dd style="color:${bal > 0 ? "var(--warn)" : "var(--g7)"}">${st === "cancelled" || st === "expired" ? "—" : peso(bal)}</dd></dl></div>
      ${b.cancelled_at ? notice(`Cancelled ${fmtDT(b.cancelled_at)}${b.cancelled_by_name ? ` by ${esc(b.cancelled_by_name)}` : ""}. Reason: “${esc(b.cancellation_reason)}”. Refund due: ${peso(b.refund_due || 0)}.`, "warn") : ""}
      ${action}${btns.length ? `<div class="row">${btns.join("")}</div>` : ""}
      <div><h3 style="margin-bottom:8px">Payments</h3><div class="stack" style="gap:8px">${pays}</div></div>
    </div>`;
  },
  drawerBind(root) {
    const b = Staff.drawer.b; if (!b) return;
    const again = async (ok) => { if (ok !== undefined) { Staff.drawer.mode = null; await Staff.reloadBooking(); Staff.refreshPage?.(); } };
    wire(root, {
      mode: (el) => { Staff.drawer.mode = el.dataset.m || null; renderModal(); },
      rejectm: (el) => { Staff.drawer.mode = "reject"; Staff.drawer.pay = el.dataset.id; renderModal(); },
      proof: async (el) => {
        const box = el.nextElementSibling?.classList.contains("proof-view") ? el.nextElementSibling : null;
        if (box) { box.remove(); el.textContent = "View payment screenshot"; return; }
        const url = await run(async () => { const { data, error } = await sb.storage.from("payment-proofs").createSignedUrl(el.dataset.p, 600); if (error) throw error; return data.signedUrl; });
        if (!url) return;
        const isPdf = /\.pdf$/i.test(el.dataset.p);
        el.insertAdjacentHTML("afterend", `<div class="proof-view">${isPdf
          ? `<iframe src="${esc(url)}" title="Payment proof" style="width:100%;height:480px;border:1px solid var(--line);border-radius:12px"></iframe>`
          : `<img src="${esc(url)}" alt="Payment screenshot" style="width:100%;border:1px solid var(--line);border-radius:12px;display:block">`}
          <a href="${esc(url)}" target="_blank" rel="noopener" class="muted" style="font-size:13px">Open full size</a></div>`);
        el.textContent = "Hide payment screenshot";
      },
      approve: async (el) => again(await run(() => rpc("verify_payment", { p_payment_id: el.dataset.id, p_force_confirm: false }), (r) => `Payment confirmed — booking is ${STATUS_LABEL[r.booking_status]}.`)),
      outcome: async (el) => again(await run(() => rpc("set_booking_outcome", { p_booking_id: b.id, p_outcome: el.dataset.to }), "Updated.")),
      pay: async (f, d) => again(await run(() => rpc("record_booking_payment", { p_booking_id: b.id, p_amount: Number(d.amount), p_payment_method_id: d.method, p_kind: d.kind, p_reference_no: d.refno || null, p_notes: null }), (r) => r.booking_status === "confirmed" ? "Payment saved — booking confirmed." : "Payment saved.")),
      reject: async (f, d) => again(await run(() => rpc("reject_payment", { p_payment_id: Staff.drawer.pay, p_reason: d.reason }), "Payment rejected — the customer has a new deadline to pay.")),
      checkin: async (f, d) => again(await run(() => rpc("check_in_booking", { p_booking_id: b.id, p_players_checked_in: d.players === undefined ? null : Number(d.players) }), "Checked in.")),
      cancel: async (f, d) => again(await run(() => rpc("cancel_booking", { p_booking_id: b.id, p_reason: d.reason, p_refund_amount: d.refund === "" ? null : Number(d.refund) }), (r) => `Cancelled. Refund due ${peso(r.refund_due)}.`)),
      refund: async (f, d) => again(await run(async () => rpc("record_refund", { p_booking_id: b.id, p_amount: Number(d.amount), p_payment_method_id: d.method, p_reference_no: d.refno || null, p_notes: null, p_receipt_path: await uploadReceipt("refund", d.receipt) }), "Refund recorded.")),
      extend: async (f, d) => again(await run(() => rpc("extend_booking_expiry", { p_booking_id: b.id, p_hours: Number(d.hours) }), "Deadline extended.")),
    });
  },
};

// ---------------------------------------------------------------- shared staff bits
const Views = {};
function pageHead(title, sub = "", actions = "") {
  return `<div class="head"><div><p class="eyebrow">${esc(PUB.business_name)}</p><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${actions ? `<div class="row">${actions}</div>` : ""}</div>`;
}
function dateNav(date, base) {
  const t = PUB.today, go = (d) => `${base}?d=${d}`;
  return `<div class="row" style="margin-bottom:14px"><div class="seg"><a href="${go(t)}" class="seg-a" aria-pressed="${date === t}">Today</a><a href="${go(addDays(t, 1))}" class="seg-a" aria-pressed="${date === addDays(t, 1)}">Tomorrow</a></div>
    <a class="btn sec sm" href="${go(addDays(date, -1))}" aria-label="Previous day">‹</a><input class="in" type="date" value="${date}" data-a="pickdate" data-base="${base}" style="width:auto;min-height:36px" aria-label="Pick a date"><a class="btn sec sm" href="${go(addDays(date, 1))}" aria-label="Next day">›</a>
    <b style="margin-left:4px">${fmtDate(date, { weekday: "long", month: "long", day: "numeric" })}</b></div>`;
}
const pickdate = (el) => nav(`${el.dataset.base}?d=${el.value}`);
async function loadMethods() { if (!Staff.methods) Staff.methods = await q(sb.from("payment_methods").select("*").order("sort_order")); return Staff.methods; }
function bookingRows(list) {
  if (!list.length) return `<p class="empty">No bookings.</p>`;
  return `<div class="scroll-x"><table class="t"><thead><tr><th>Reference</th><th>Customer</th><th>Date</th><th>Time</th><th>What</th><th>Status</th><th class="r">Total</th><th class="r">Balance</th></tr></thead><tbody>
    ${list.map((b) => `<tr class="click" data-a="open" data-id="${b.id}"><td class="ref">${esc(b.reference)}${b.review_pending ? ` <span class="tag" style="background:var(--info-bg);color:var(--info)">REVIEW</span>` : ""}</td><td>${esc(b.customer_name)}${b.source === "online" ? ` <span class="muted" style="font-size:12px">online</span>` : ""}</td><td>${fmtDate(b.business_date)}</td><td class="num">${fmtRange(b.starts_at, b.ends_at)}</td>
    <td>${b.booking_type === "open_play" ? `Open Play · ${b.player_count}p` : esc(b.lines.map((l) => l.court).join(", "))}</td><td>${statusPill(b.status)}</td><td class="r num">${peso(b.total_amount)}</td><td class="r num">${["cancelled", "expired"].includes(b.status) ? "—" : peso(b.balance_due)}</td></tr>`).join("")}</tbody></table></div>`;
}
const openBookingAct = (el) => Staff.openBooking(el.dataset.id);

// ---------------------------------------------------------------- Dashboard
Views.dashboard = async (root) => {

  const rev = d.revenue, totalRev = rev ? sum(Object.values(rev)) : 0, maxB = rev ? Math.max(1, ...Object.values(rev).map(Number)) : 1;

  root.innerHTML = `${pageHead(`${hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening"}, ${esc(Staff.acct.full_name.split(" ")[0])}`, `${fmtDate(d.date, { weekday: "long", month: "long", day: "numeric" })} · open ${clock(PUB.open_time)} – ${clock(PUB.close_time)}`,
    `<a class="btn" href="#/staff/new/court">${ic("plus")} Court rental</a><a class="btn sec" href="#/staff/new/open-play">${ic("plus")} Open Play</a>${Staff.can("pos.sell") ? `<a class="btn sec" href="#/staff/pos">${ic("pos")} POS</a>` : ""}`)}
  <div class="grid ${rev ? "g5" : "g4"}">
    ${rev ? `<div class="card stat"><div class="l">Today's revenue</div><div class="v num">${peso(totalRev)}</div><div class="d">Collected ${peso(d.collected)}</div></div>` : ""}
    <div class="card stat"><div class="l">Today's bookings</div><div class="v num">${d.bookings.total}</div><div class="d">${d.bookings.court_rentals} court rental${d.bookings.court_rentals === 1 ? "" : "s"} · ${d.bookings.open_play_players} Open Play players</div></div>
    <div class="card stat"><div class="l">Courts in use now</div><div class="v num">${d.occupied_now}<small>/ ${d.courts_active}</small></div><div class="d">${fmtT(d.now)}</div></div>
    <div class="card stat ${d.to_review.length + d.awaiting_payment ? "warn" : ""}"><div class="l">Pending payments</div><div class="v num">${d.to_review.length + d.awaiting_payment}</div><div class="d">${d.to_review.length} to review · ${d.awaiting_payment} not yet paid</div></div>
    <div class="card stat ${d.low_stock.length ? "warn" : ""}"><div class="l">Low stock</div><div class="v num">${d.low_stock.length}</div><div class="d">${esc(d.low_stock.slice(0, 2).map((x) => x.name.replace(" [DEMO]", "")).join(", ") || "All stocked")}</div></div>
  </div>
  ${d.to_review.length ? `<div class="card" style="margin-top:14px"><h2>Payments to review</h2><div class="scroll-x"><table class="t"><thead><tr><th>Reference</th><th>Customer</th><th>Type</th><th>Play date</th><th class="r">Amount</th><th>Method</th><th>Sent</th></tr></thead><tbody>
    ${d.to_review.map((x) => `<tr class="click" data-a="open" data-id="${x.booking_id}"><td class="ref">${esc(x.reference)}</td><td>${esc(x.customer)}</td><td>${x.type === "open_play" ? "Open Play" : "Court Rental"}</td><td>${fmtDate(x.business_date)}</td><td class="r num">${peso(x.amount)}</td><td>${esc(x.method || "")}${x.reference_no ? ` <span class="mono muted">${esc(x.reference_no)}</span>` : ""}</td><td>${relTime(x.submitted_at)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
  ${day ? `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Today's courts</h2><a class="btn ghost sm" href="#/staff/courts">Court rentals ${ic("arrow")}</a></div>${schedGrid(day, true)}</div>` : ""}

// Court × time grid built from staff_day()
function schedGrid(day, compact = false) {
  const len = day.operating_minutes, ppm = compact ? 0.72 : 1.1, step = 30, openMs = new Date(day.open).getTime();
  const off = (iso) => Math.round((new Date(iso).getTime() - openMs) / 60e3);
  const blocks = Object.fromEntries(day.courts.map((c) => [c.id, []]));
  for (const s of day.sessions) for (const cid of s.courts) blocks[cid]?.push({ s: off(s.starts_at), e: off(s.ends_at), cls: "op", title: "Open Play", sub: `${s.booked}/${s.capacity} players`, attrs: `href="#/staff/open-play?d=${day.date}"`, tag: "a" });
  for (const b of day.rentals) {
    if (["cancelled", "expired"].includes(b.status)) continue;
    for (const l of b.lines) blocks[l.court_id]?.push({ s: off(l.starts_at), e: off(l.ends_at), cls: b.status, title: esc(b.customer_name), sub: `${fmtRange(l.starts_at, l.ends_at)} · ${STATUS_LABEL[b.status]}`, attrs: `data-a="open" data-id="${b.id}"`, tag: "button" });
  }
  const rows = Math.ceil(len / step), now = off(day.now);
  const timeCol = Array.from({ length: rows }, (_, i) => `<div class="tm" style="height:${step * ppm}px">${i % 2 === 0 ? offClock(i * step) : ""}</div>`).join("");
  const slots = Array.from({ length: rows }, (_, i) => `<div class="slot ${i % 2 ? "hour" : ""}" style="height:${step * ppm}px"></div>`).join("");
  const cols = day.courts.map((c) => `<div class="col">${slots}${blocks[c.id].map((k) => `<${k.tag} class="blk ${k.cls}" ${k.attrs} style="top:${k.s * ppm + 1}px;height:${(k.e - k.s) * ppm - 3}px;text-decoration:none">${k.title}${(k.e - k.s) * ppm > 34 ? `<small>${k.sub}</small>` : ""}</${k.tag}>`).join("")}${now >= 0 && now <= len ? `<div class="nowline" style="top:${now * ppm}px"></div>` : ""}${c.status === "maintenance" ? `<div class="blk completed" style="top:2px;bottom:2px;height:auto;cursor:default">Maintenance</div>` : ""}</div>`).join("");
  return `<div class="scroll-x"><div class="sched" style="grid-template-columns:64px repeat(${day.courts.length},minmax(130px,1fr))"><div class="h"></div>${day.courts.map((c) => `<div class="h">${esc(c.name)}</div>`).join("")}<div>${timeCol}</div>${cols}</div></div>
  <div class="legend" style="margin-top:10px"><span><i style="background:#fff;border-color:var(--line-2)"></i>Available</span><span><i style="background:var(--warn-bg);border-color:var(--warn-line)"></i>Pending payment</span><span><i style="background:var(--info-bg);border-color:var(--info-line)"></i>Payment submitted</span><span><i style="background:var(--g1);border-color:var(--g5)"></i>Reserved</span><span><i style="background:var(--g7);border-color:var(--g8)"></i>Checked in</span><span><i style="background:repeating-linear-gradient(135deg,var(--g1) 0 4px,#EAF3EC 4px 8px);border-color:var(--g2)"></i>Open Play</span><span><i style="background:#F0EEEA;border-color:#DDD8CE"></i>Completed</span></div>`;
}

            }, "Stock received.");
            if (ok) { closeModal(); reload(); }
          } });
        } });
    },
  });
};

// ---------------------------------------------------------------- Reports
function presetRange(p, params) {
  const t = PUB.today, [y, m] = t.split("-").map(Number), pad = (n) => String(n).padStart(2, "0"), last = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  switch (p) {
    case "today": return [t, t];
    case "yesterday": return [addDays(t, -1), addDays(t, -1)];
    case "week": return [addDays(t, -dowOf(t)), t];
    case "prev_month": { const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1; return [`${py}-${pad(pm)}-01`, `${py}-${pad(pm)}-${last(py, pm)}`]; }
    case "year": return [`${y}-01-01`, t];
    case "prev_year": return [`${y - 1}-01-01`, `${y - 1}-12-31`];
    case "custom": return [params.get("from") || t, params.get("to") || t];
    default: return [`${y}-${pad(m)}-01`, t];
  }
}

    await rpc("complete_setup", { p: {
      business: { name: d.name, address: d.address, phone: d.phone, email: d.email, open_time: d.open, close_time: d.close },
      courts: { count: d.courts, names: d.names },
      open_play: { price: d.opPrice, duration_minutes: d.opDur, players_per_court: d.perCourt, sessions: d.sessions },
      rates: { day_rate: d.dayRate, evening_rate: d.eveRate, evening_start: d.eveStart },
      booking: { reservation_fee_pct: d.fee, payment_expiry_hours: d.expiry },
      payment_methods: [
        { name: "Cash", kind: "cash", use_for_pos: true, use_for_online: false },
        { name: "GCash", kind: "gcash", account_name: d.gcashName, account_number: d.gcashNum, use_for_pos: true, use_for_online: !!d.gcashNum },
        { name: "Bank Transfer", kind: "bank", bank_name: d.bank, account_name: d.bankName, account_number: d.bankNum, use_for_pos: true, use_for_online: !!d.bankNum },
        { name: "Other", kind: "other", use_for_pos: true, use_for_online: false }],
      payment_instructions: d.instructions,
      equipment: { paddle_price: d.paddle, ball_price: d.ball, paddle_qty: d.paddleQty, ball_qty: d.ballQty },
      cancellation: { refund_cutoff_hours: d.refundH, forfeit_cutoff_hours: d.forfeitH, refund_pct: d.refundPct, middle_window_policy: d.middle, policy_text: d.policy },
      investors: d.investors.map((x) => ({ name: x.name, investment_amount: x.amount, ownership_pct: x.pct, start_date: PUB.today })),
      load_demo_data: d.demo } });
  },
};

// ---------------------------------------------------------------- password reset & boot
if (sb) sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    APP.innerHTML = `<div class="login">${logoBlock(120)}<form class="card stack" data-f="pw"><h2>Choose a new password</h2>${field("New password", inp("password", "", 'type="password" minlength="8" required autocomplete="new-password"'))}<button class="btn">Save password</button></form></div>`;
    wire(APP, { pw: async (f, d) => { const ok = await run(async () => { const { error } = await sb.auth.updateUser({ password: d.password }); if (error) throw error; }, "Password updated."); if (ok) nav("#/staff"); } });
  }
});
render();
</script></body></html>
